# Port of the GitLab pipeline. Setup and rationale: docs/hil-setup.md
name: CI

# Never add pull_request/pull_request_target: fork code would run on the docker-group HIL runners.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      force_image_rebuild:
        description: Rebuild the CI container image even if its content-hash tag already exists
        type: boolean
        default: false

# Per ref, not per workflow: an unrelated branch's push should not cancel this one's build/check
# work. Cross-branch board safety is handled separately, by flash-target.yml's own concurrency
# group, which is scoped to the target and holds regardless of which ref is flashing it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read # every container job pulls the CI image from ghcr

env:
  CARGO_HOME: /persist/cargo
  CARGO_TARGET_DIR: /persist/target
  UV_CACHE_DIR: /persist/uv
  UV_PYTHON_INSTALL_DIR: /persist/uv-python
  UV_LINK_MODE: copy
  # Container jobs get HOME=/github/home forced by the runner even if container.env sets HOME
  # (confirmed on a live run: overriding HOME there is a no-op), so espup's install location
  # has to be named explicitly instead.
  ESP_ENV_SCRIPT: /root/export-esp.sh

jobs:
  image:
    # Host job, not a container job: it builds the image and needs the docker socket.
    runs-on: [self-hosted, mrsbench, hostjob]
    timeout-minutes: 40
    permissions:
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      # Tag is a content hash of the Dockerfile, so an unchanged file is a no-op below.
      - id: tag
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          h=$(sha256sum .github/docker/Dockerfile.ci | cut -c1-16)
          echo "image=ghcr.io/$repo/ci:$h" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/$repo/ci:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: check
        run: |
          if [ "${{ inputs.force_image_rebuild }}" != "true" ] \
            && docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.build == 'true'
        run: |
          docker build \
            -t "${{ steps.tag.outputs.image }}" -t "${{ steps.tag.outputs.latest }}" \
            -f .github/docker/Dockerfile.ci .github/docker
          docker push "${{ steps.tag.outputs.image }}"
          if [ "${{ github.ref }}" = refs/heads/main ]; then
            docker push "${{ steps.tag.outputs.latest }}"
          fi

  # One job per target, each calling build-target.yml: run-firmware-<target> can then need only
  # its own target's build job, so it starts as soon as that target is built instead of waiting
  # for every target. See docs/hil-setup.md.
  build-host:
    needs: image
    uses: ./.github/workflows/build-target.yml
    with:
      target: host
      bin: mrs-benchmark-host
      triple: x86_64-unknown-linux-gnu
      profiles: '["release","lto","size"]'
      image: ${{ needs.image.outputs.image }}

  build-stm32:
    needs: image
    uses: ./.github/workflows/build-target.yml
    with:
      target: stm32
      bin: mrs-benchmark-stm32
      triple: thumbv7em-none-eabihf
      profiles: '["release","lto","size","xlto"]'
      image: ${{ needs.image.outputs.image }}

  build-nrf52840:
    needs: image
    uses: ./.github/workflows/build-target.yml
    with:
      target: nrf52840
      bin: mrs-benchmark-nrf52840
      triple: thumbv7em-none-eabihf
      profiles: '["release","lto","size","xlto"]'
      image: ${{ needs.image.outputs.image }}

  build-rp2040:
    needs: image
    uses: ./.github/workflows/build-target.yml
    with:
      target: rp2040
      bin: mrs-benchmark-rp2040
      triple: thumbv6m-none-eabi
      profiles: '["release","lto","size"]'
      image: ${{ needs.image.outputs.image }}

  build-rp2350:
    needs: image
    uses: ./.github/workflows/build-target.yml
    with:
      target: rp2350
      bin: mrs-benchmark-rp2350
      triple: thumbv8m.main-none-eabihf
      profiles: '["release","lto","size","xlto"]'
      image: ${{ needs.image.outputs.image }}

  build-esp32s3:
    needs: image
    uses: ./.github/workflows/build-target.yml
    with:
      target: esp32s3
      bin: mrs-benchmark-esp32s3
      triple: xtensa-esp32s3-none-elf
      profiles: '["release","lto","size"]'
      image: ${{ needs.image.outputs.image }}

  check:
    # forces check to the back of the build runner's queue; run-firmware-* is a separate
    # runner pool, so check does not need to wait on it too
    needs:
      - image
      - build-host
      - build-stm32
      - build-nrf52840
      - build-rp2040
      - build-rp2350
      - build-esp32s3
      - run-host
    if: ${{ !cancelled() && needs.image.result == 'success' }} # advisory, so a failed build leg must not skip it
    runs-on: [self-hosted, mrsbench, build]
    timeout-minutes: 30
    continue-on-error: true # advisory, fmt and clippy never block a merge
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - mrs-cargo-cache:/persist
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fmt,             dir: benchmarks,                        run: "cargo fmt --all -- --check" }
          - { name: clippy-host,     dir: benchmarks,                        run: "cargo clippy -- -D warnings" }
          - { name: clippy-stm32,    dir: benchmarks/mrs-benchmark-stm32,    run: "cargo clippy -- -D warnings" }
          - { name: clippy-nrf52840, dir: benchmarks/mrs-benchmark-nrf52840, run: "cargo clippy -- -D warnings" }
          - { name: clippy-rp2040,   dir: benchmarks/mrs-benchmark-rp2040,   run: "cargo clippy -- -D warnings" }
          - { name: clippy-rp2350,   dir: benchmarks/mrs-benchmark-rp2350,   run: "cargo clippy -- -D warnings" }
          - { name: clippy-esp32s3,  dir: benchmarks/mrs-benchmark-esp32s3,  run: '. "${ESP_ENV_SCRIPT:-$HOME/export-esp.sh}" && cargo clippy -- -D warnings' }
    name: check (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: cd "${{ matrix.dir }}" && ${{ matrix.run }}

  run-host:
    # needs every build-*, not just build-host, so it queues behind them on the shared build
    # runner instead of possibly interleaving with a still-running compile; run-firmware-* is
    # a separate runner pool and can't add CPU noise to this timing-sensitive benchmark
    needs:
      - image
      - build-host
      - build-stm32
      - build-nrf52840
      - build-rp2040
      - build-rp2350
      - build-esp32s3
    if: ${{ !cancelled() && needs.image.result == 'success' }} # one failed build leg must not skip the rest
    runs-on: [self-hosted, mrsbench, build]
    timeout-minutes: 15
    container: # glibc parity with the build that produced the host binary
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - mrs-cargo-cache:/persist
    steps:
      # The workspace persists across runs; a stale ELF here would be re-run as a fresh result.
      - run: rm -rf fw
      - uses: actions/download-artifact@v8
        with:
          pattern: fw-host-*
          merge-multiple: true
          path: fw
      # RUNNER_TEMP is emptied per job; the workspace is not, and this job never checks out.
      - run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          for prof in release lto size; do
            chmod +x "fw/mrs-benchmark-host-$prof"
            "./fw/mrs-benchmark-host-$prof" | tee "$RUNNER_TEMP/logs/host-$prof.log"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-host
          path: ${{ runner.temp }}/logs/*.log
          retention-days: 90

  # One job per target, each calling flash-target.yml with needs: build-<target> instead of
  # needs: build, so it starts as soon as its own target's build finishes. Each call is still a
  # single job, so a given board is only ever touched by one job at a time (see flash-target.yml).
  run-firmware-stm32:
    needs: build-stm32
    if: ${{ !cancelled() }} # a build failure for this target must not skip flashing what did build
    uses: ./.github/workflows/flash-target.yml
    with:
      target: stm32
      chip: STM32F405RGTx
      bin: mrs-benchmark-stm32
      probe_var: HIL_PROBE_STM32
      speed: "4000"
      profiles: "release lto size xlto"

  run-firmware-nrf52840:
    needs: build-nrf52840
    if: ${{ !cancelled() }} # a build failure for this target must not skip flashing what did build
    uses: ./.github/workflows/flash-target.yml
    with:
      target: nrf52840
      chip: nRF52840_xxAA
      bin: mrs-benchmark-nrf52840
      probe_var: HIL_PROBE_NRF52840
      speed: "4000"
      profiles: "release lto size xlto"

  run-firmware-rp2040:
    needs: build-rp2040
    if: ${{ !cancelled() }} # a build failure for this target must not skip flashing what did build
    uses: ./.github/workflows/flash-target.yml
    with:
      target: rp2040
      chip: RP2040
      bin: mrs-benchmark-rp2040
      probe_var: HIL_PROBE_RP2040
      speed: "10000"
      profiles: "release lto size"

  run-firmware-rp2350:
    needs: build-rp2350
    if: ${{ !cancelled() }} # a build failure for this target must not skip flashing what did build
    uses: ./.github/workflows/flash-target.yml
    with:
      target: rp2350
      chip: RP235x
      bin: mrs-benchmark-rp2350
      probe_var: HIL_PROBE_RP2350
      speed: "10000"
      profiles: "release lto size xlto"

  run-firmware-esp32s3:
    needs: build-esp32s3
    if: ${{ !cancelled() }} # a build failure for this target must not skip flashing what did build
    uses: ./.github/workflows/flash-target.yml
    with:
      target: esp32s3
      chip: esp32s3
      bin: mrs-benchmark-esp32s3
      probe_var: HIL_PROBE_ESP32S3
      speed: ""
      profiles: "release lto size"

  collect:
    needs:
      - image
      - run-host
      - run-firmware-stm32
      - run-firmware-nrf52840
      - run-firmware-rp2040
      - run-firmware-rp2350
      - run-firmware-esp32s3
    # merge whatever logs exist even if a flash leg died, but host rows are not optional
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.run-host.result == 'success' }}
    runs-on: [self-hosted, mrsbench, build]
    timeout-minutes: 15
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - mrs-cargo-cache:/persist
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # collect reads submodule SHAs into library_versions.json
      - uses: actions/download-artifact@v8
        with:
          pattern: logs-*
          merge-multiple: true
          path: logs
      - run: cd benchmarks && cargo run --quiet -p mrs-benchmark-collect -- ../logs/*.log -o ../results.csv
      - uses: actions/upload-artifact@v7
        with:
          name: results
          path: |
            results.csv
            library_versions.json
          retention-days: 90

  report:
    needs: [image, collect]
    # No status-check function (success/failure/cancelled/always) in an if: means GitHub ANDs
    # in an implicit success(), which checks the WHOLE ancestor chain, not just these needs: a
    # failed build-esp32s3 leg would then skip this even though it only needs image and collect.
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.collect.result == 'success' }}
    continue-on-error: true # a plotting bug should not fail the pipeline
    runs-on: [self-hosted, mrsbench, build]
    timeout-minutes: 20
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - mrs-cargo-cache:/persist
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/download-artifact@v8
        with:
          name: results
      - run: uv run tools/inputs_generator/evaluate_accuracy.py --results results.csv --reference benchmarks/reference_results.json --output-csv accuracy_results.csv --output-json accuracy_results.json
      - run: uv run --project viz viz/plot.py results.csv report.pdf
      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: |
            report.pdf
            accuracy_results.csv
            accuracy_results.json
          retention-days: 90

  # Two releases per successful main build: a permanent per-commit archive (never
  # overwritten, so it survives independent of the 90-day artifact retention above)
  # and a rolling `latest` release pinned as GitHub's actual "Latest release" so
  # /releases/latest and the repo sidebar badge always resolve to it.
  publish:
    needs: [collect, report]
    permissions:
      contents: write # creates per-build releases, moves the rolling `latest` one
    # Same implicit-success() trap as report above: needs.collect.result alone is a plain
    # boolean expression, so without !cancelled() this would also silently require every
    # ancestor job (build-esp32s3, run-firmware-*, check) to have succeeded too.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.collect.result == 'success' }}
    runs-on: [self-hosted, mrsbench, hostjob]
    timeout-minutes: 10
    continue-on-error: true
    steps:
      # report is continue-on-error, so without this a failed run re-publishes the previous report.pdf.
      - run: rm -f report.pdf results.csv library_versions.json accuracy_results.csv accuracy_results.json
      - uses: actions/download-artifact@v8
        with:
          name: results
      - uses: actions/download-artifact@v8
        with:
          name: report
      - id: build-info
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ steps.build-info.outputs.sha }}
          name: Main build ${{ steps.build-info.outputs.date }} (${{ steps.build-info.outputs.sha }})
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: false
          files: |
            report.pdf
            results.csv
            library_versions.json
            accuracy_results.csv
            accuracy_results.json
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest main build
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            report.pdf
            results.csv
            library_versions.json
            accuracy_results.csv
            accuracy_results.json
