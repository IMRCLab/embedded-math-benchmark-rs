[tasks.bench-host]
description = "Build and run host benchmarks natively"
category = "Benchmark"
script = [
    "cargo run --release --manifest-path benchmarks/mrs-benchmark-host/Cargo.toml"
]

[tasks.bench-stm]
description = "Build and run STM32 benchmarks over ST-Link"
category = "Benchmark"
script = [
    "(cd benchmarks/mrs-benchmark-stm32 && cargo build --release)",
    "probe-rs run --chip STM32F405RGTx benchmarks/target/thumbv7em-none-eabihf/release/mrs-benchmark-stm32"
]

[tasks.bench-pico]
description = "Build and run Raspberry Pi Pico 1 (RP2040) benchmarks over SWD"
category = "Benchmark"
script = [
    "(cd benchmarks/mrs-benchmark-rp2040 && cargo build --release)",
    "probe-rs run --chip RP2040 benchmarks/target/thumbv6m-none-eabi/release/mrs-benchmark-rp2040"
]

[tasks.bench-pico2]
description = "Build and run Raspberry Pi Pico 2 (RP2350) benchmarks over SWD"
category = "Benchmark"
script = [
    "(cd benchmarks/mrs-benchmark-rp2350 && cargo build --release)",
    "probe-rs run --chip RP235x benchmarks/target/thumbv8m.main-none-eabihf/release/mrs-benchmark-rp2350"
]

[tasks.collect]
description = "Merge benchmark BENCH lines into a single headed CSV (files or stdin)"
category = "Benchmark"
command = "cargo"
args = ["run", "--quiet", "--manifest-path", "benchmarks/Cargo.toml", "-p", "mrs-benchmark-collect", "${@}"]
