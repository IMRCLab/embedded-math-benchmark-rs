[tasks.bench-host]
description = "Build and run host benchmarks natively"
category = "Benchmark"
workspace = false
command = "cargo"
args = ["run", "--release", "--manifest-path", "benchmarks/mrs-benchmark-host/Cargo.toml"]

# --- STM32 ---
[tasks.build-stm]
description = "Build the STM32 firmware"
private = true
cwd = "benchmarks/mrs-benchmark-stm32"
command = "cargo"
args = ["build", "--release"]

[tasks.bench-stm]
description = "Build and run STM32 benchmarks over ST-Link"
category = "Benchmark"
workspace = false
dependencies = ["build-stm"]
command = "probe-rs"
args = ["run", "--chip", "STM32F405RGTx", "benchmarks/target/thumbv7em-none-eabihf/release/mrs-benchmark-stm32"]

# --- RP2040 (Pico) ---
[tasks.build-pico]
description = "Build the RP2040 firmware"
private = true
cwd = "benchmarks/mrs-benchmark-rp2040"
command = "cargo"
args = ["build", "--release"]

[tasks.bench-pico]
description = "Build and run Raspberry Pi Pico 1 (RP2040) benchmarks over SWD"
category = "Benchmark"
workspace = false
dependencies = ["build-pico"]
command = "probe-rs"
args = ["run", "--chip", "RP2040", "benchmarks/target/thumbv6m-none-eabi/release/mrs-benchmark-rp2040"]

# --- RP2350 (Pico 2) ---
[tasks.build-pico2]
description = "Build the RP2350 firmware"
private = true
cwd = "benchmarks/mrs-benchmark-rp2350"
command = "cargo"
args = ["build", "--release"]

[tasks.bench-pico2]
description = "Build and run Raspberry Pi Pico 2 (RP2350) benchmarks over SWD"
category = "Benchmark"
workspace = false
dependencies = ["build-pico2"]
command = "probe-rs"
args = ["run", "--chip", "RP235x", "benchmarks/target/thumbv8m.main-none-eabihf/release/mrs-benchmark-rp2350"]

# --- ESP32-S3 ---
[tasks.build-esp32]
description = "Build the ESP32-S3 firmware"
private = true
cwd = "benchmarks/mrs-benchmark-esp32s3"
# Pins the toolchain cargo-make's outer `cargo` dispatch would otherwise override (see script below).
env = { RUSTUP_TOOLCHAIN = "esp" }
script_runner = "@shell"
# Sources espup's env (linker on PATH) so callers don't have to remember to.
script = ['source "$HOME/export-esp.sh"', 'cargo build --release']

[tasks.bench-esp32]
description = "Build and run ESP32-S3 benchmarks over its native USB JTAG"
category = "Benchmark"
workspace = false
dependencies = ["build-esp32"]
command = "probe-rs"
# Own Cargo.lock, own target dir (not benchmarks/target/ like the other firmware crates).
args = ["run", "--chip", "esp32s3", "benchmarks/mrs-benchmark-esp32s3/target/xtensa-esp32s3-none-elf/release/mrs-benchmark-esp32s3"]

# --- Collect ---
[tasks.collect]
description = "Merge benchmark BENCH lines into a single headed CSV (files or stdin)"
category = "Benchmark"
workspace = false
command = "cargo"
args = ["run", "--quiet", "--manifest-path", "benchmarks/Cargo.toml", "-p", "mrs-benchmark-collect", "${@}"]

# --- Tools & Accuracy ---
[tasks.inputs]
description = "Generate benchmarks/inputs.json using Python task registry"
category = "Tools"
workspace = false
cwd = "tools/inputs_generator"
command = "uv"
args = ["run", "python", "generate_inputs.py"]

[tasks.generate-ref]
description = "Generate benchmarks/reference_results.json f64 ground truth references"
category = "Tools"
workspace = false
cwd = "tools/inputs_generator"
command = "uv"
args = ["run", "python", "generate_reference.py"]

[tasks.eval-accuracy]
description = "Evaluate numerical accuracy (ULP distance, relative error) against reference ground truth"
category = "Tools"
workspace = false
cwd = "tools/inputs_generator"
command = "uv"
args = ["run", "python", "evaluate_accuracy.py"]

# --- Report ---
[tasks.report]
description = "Render results.csv into a per-platform PDF report via viz/plot.py"
category = "Benchmark"
workspace = false
command = "uv"
args = ["run", "viz/plot.py", "results.csv", "report.pdf"]
