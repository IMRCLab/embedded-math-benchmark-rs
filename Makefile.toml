# --- ESP32-S3 ---
[tasks.build-esp32s3]
description = "Build the ESP32-S3 firmware"
category = "Firmware Build"
cwd = "benchmarks/mrs-benchmark-esp32s3"
# Pins the toolchain cargo-make's outer `cargo` dispatch would otherwise override (see script below).
env = { RUSTUP_TOOLCHAIN = "esp" }
script_runner = "@shell"
# Sources espup's env (linker on PATH) so callers don't have to remember to.
# `@shell` runs scripts via dash, not bash, so this needs POSIX `.`, not `source`.
script = ['. "${ESP_ENV_SCRIPT:-$HOME/export-esp.sh}"', 'cargo build --release']

[tasks.build-esp32s3-lto]
description = "Build the ESP32-S3 firmware with LTO"
category = "Firmware Build"
extend = "build-esp32s3"
script = ['. "${ESP_ENV_SCRIPT:-$HOME/export-esp.sh}"', 'cargo build --profile lto']

[tasks.build-esp32s3-size]
description = "Build the ESP32-S3 firmware with the size profile"
category = "Firmware Build"
extend = "build-esp32s3"
script = ['. "${ESP_ENV_SCRIPT:-$HOME/export-esp.sh}"', 'cargo build --profile size']

[tasks.bench-esp32s3]
description = "Build and run ESP32-S3 benchmarks over its native USB JTAG"
category = "Benchmark"
workspace = false
dependencies = ["build-esp32s3"]
command = "probe-rs"
# Own Cargo.lock, own target dir (not benchmarks/target/ like the other firmware crates).
args = ["run", "--chip", "esp32s3", "benchmarks/mrs-benchmark-esp32s3/target/xtensa-esp32s3-none-elf/release/mrs-benchmark-esp32s3"]

# --- Collect ---
[tasks.collect]
description = "Merge benchmark BENCH lines into a single headed CSV (files or stdin)"
category = "Benchmark"
workspace = false
command = "cargo"
args = ["run", "--quiet", "--manifest-path", "benchmarks/Cargo.toml", "-p", "mrs-benchmark-collect", "${@}"]

# --- Tools & Accuracy ---
[tasks.inputs]
description = "Generate benchmarks/inputs.json using Python task registry"
category = "Tools"
workspace = false
cwd = "tools/inputs_generator"
command = "uv"
args = ["run", "python", "generate_inputs.py"]

[tasks.generate-ref]
description = "Generate benchmarks/reference_results.json f64 ground truth references"
category = "Tools"
workspace = false
cwd = "tools/inputs_generator"
command = "uv"
args = ["run", "python", "generate_reference.py"]

[tasks.eval-accuracy]
description = "Evaluate numerical accuracy (ULP distance, relative error) against reference ground truth"
category = "Tools"
workspace = false
cwd = "tools/inputs_generator"
command = "uv"
args = ["run", "python", "evaluate_accuracy.py"]

[tasks.update]
description = "Update inputs.json and reference_results.json ground truth"
category = "Tools"
workspace = false
dependencies = ["inputs", "generate-ref"]

# --- Report ---
[tasks.report]
description = "Render results.csv into a per-platform PDF report via viz/plot.py"
category = "Benchmark"
workspace = false
dependencies = ["eval-accuracy"]
command = "uv"
args = ["run", "--project", "viz", "viz/plot.py", "results.csv", "report.pdf"]

[tasks.paper-figures]
description = "Render the curated paper figures into docs/draft/images/ via viz/paper_figures.py"
category = "Benchmark"
workspace = false
dependencies = ["eval-accuracy"]
command = "uv"
args = ["run", "--project", "viz", "viz/paper_figures.py", "results.csv", "docs/draft/images/"]
