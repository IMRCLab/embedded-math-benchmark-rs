[tasks.bench-host]
description = "Build and run host benchmarks natively"
category = "Benchmark"
workspace = false
command = "cargo"
args = ["run", "--release", "--manifest-path", "benchmarks/mrs-benchmark-host/Cargo.toml"]

[tasks.build-host]
description = "Build the host benchmarks natively"
category = "Firmware Build"
workspace = false
command = "cargo"
args = ["build", "--release", "--manifest-path", "benchmarks/mrs-benchmark-host/Cargo.toml", "--target", "x86_64-unknown-linux-gnu"]

[tasks.build-host-lto]
description = "Build the host benchmarks natively with LTO"
category = "Firmware Build"
extend = "build-host"
args = ["build", "--profile", "lto", "--manifest-path", "benchmarks/mrs-benchmark-host/Cargo.toml", "--target", "x86_64-unknown-linux-gnu"]

[tasks.build-host-size]
description = "Build the host benchmarks natively with the size profile"
category = "Firmware Build"
extend = "build-host"
args = ["build", "--profile", "size", "--manifest-path", "benchmarks/mrs-benchmark-host/Cargo.toml", "--target", "x86_64-unknown-linux-gnu"]

# --- STM32 ---
[tasks.build-stm32]
description = "Build the STM32 firmware"
category = "Firmware Build"
cwd = "benchmarks/mrs-benchmark-stm32"
command = "cargo"
args = ["build", "--release"]

[tasks.bench-stm32]
description = "Build and run STM32 benchmarks over ST-Link"
category = "Benchmark"
workspace = false
dependencies = ["build-stm32"]
command = "probe-rs"
args = ["run", "--chip", "STM32F405RGTx", "benchmarks/target/thumbv7em-none-eabihf/release/mrs-benchmark-stm32"]

[tasks.build-stm32-lto]
description = "Build the STM32 firmware with LTO"
category = "Firmware Build"
extend = "build-stm32"
args = ["build", "--profile", "lto"]

[tasks.build-stm32-size]
description = "Build the STM32 firmware with the size profile"
category = "Firmware Build"
extend = "build-stm32"
args = ["build", "--profile", "size"]

# RUSTFLAGS replaces the crate's .cargo/config.toml rustflags rather than adding to them, so the
# link args are repeated here. This is the only place they're defined -- CI runs this same task
# via `cargo make`. See docs/task-categories.md for what xlto buys and why.
[tasks.build-stm32-xlto]
description = "Build the STM32 firmware with cross-language LTO"
category = "Firmware Build"
extend = "build-stm32"
args = ["build", "--profile", "xlto"]
[tasks.build-stm32-xlto.env]
RUSTFLAGS = "-C linker-plugin-lto -C target-cpu=cortex-m4 -C link-arg=-Tlink.x -C link-arg=--lto-O3"

[tasks.bench-stm32-xlto]
description = "Build and run STM32 benchmarks with cross-language LTO over ST-Link"
category = "Benchmark"
workspace = false
dependencies = ["build-stm32-xlto"]
command = "probe-rs"
args = ["run", "--chip", "STM32F405RGTx", "benchmarks/target/thumbv7em-none-eabihf/xlto/mrs-benchmark-stm32"]

