[workspace]
resolver = "2"
members = [
    "mrs-benchmark-core",
    "mrs-benchmark-host",
    "mrs-benchmark-stm32",
    "mrs-benchmark-rp2040",
    "mrs-benchmark-rp2350",
    "mrs-benchmark-macros",
    "mrs-benchmark-collect",
    "mrs-benchmark-crazyflie-sys",
]
# Bare `cargo build`/`test`/`clippy` at the workspace root act on these native crates
# only. The no_std firmware crates (mrs-benchmark-stm32, mrs-benchmark-rp2040,
# mrs-benchmark-rp2350) are built explicitly by `cd`-ing into each crate, where its
# crate-local .cargo/config.toml selects the right thumb target.
default-members = [
    "mrs-benchmark-core",
    "mrs-benchmark-host",
    "mrs-benchmark-collect",
    "mrs-benchmark-crazyflie-sys",
]

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
panic = "abort"

[profile.lto]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.size]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
