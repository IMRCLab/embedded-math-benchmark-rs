# CI for the mrs-microbenchmarks workspace (benchmarks/).
# Job definitions live in .gitlab/ci/*.yml; this file holds shared config only.

stages:
  - image
  - build
  - run
  - collect
  - report
  - check

variables:
  # Cargo state lives on the persistent /persist volume
  CARGO_HOME: /persist/cargo
  CARGO_TARGET_DIR: /persist/target
  # uv state lives on /persist too, same reasoning as cargo above
  UV_CACHE_DIR: /persist/uv
  UV_PYTHON_INSTALL_DIR: /persist/uv-python
  # The venv itself is created in the ephemeral git checkout, a different
  # filesystem than UV_CACHE_DIR above, so uv can't hardlink cache -> venv and
  # warns every run about falling back to a full copy. Silence it by asking for
  # the copy fallback directly instead of chasing the (harmless) warning.
  UV_LINK_MODE: copy
  WORKSPACE_DIR: benchmarks
  TARGET: x86_64-unknown-linux-gnu
  GIT_SUBMODULE_STRATEGY: normal
  GIT_SUBMODULE_DEPTH: 1

default:
  image:
    name: ${CI_REGISTRY_IMAGE}/ci:latest
    pull_policy: always
  tags:
    - shared

include:
  - local: .gitlab/ci/image.yml
  - local: .gitlab/ci/build.yml
  - local: .gitlab/ci/run.yml
  - local: .gitlab/ci/collect.yml
  - local: .gitlab/ci/report.yml
  - local: .gitlab/ci/check.yml
