# CI for the mrs-microbenchmarks workspace (benchmarks/).
# Host benchmarks run natively on a shared runner. The firmware crates
# (rp2040/thumbv6m, rp2350/thumbv8m, stm32/thumbv7em) are built on a shared runner
# and benchmarked on real hardware (HIL) over RTT via probe-rs.

stages:
  - build
  - run
  - collect
  - check

variables:
  # Cargo state lives on the persistent /persist volume
  CARGO_HOME: /persist/cargo
  CARGO_TARGET_DIR: /persist/target
  WORKSPACE_DIR: benchmarks
  TARGET: x86_64-unknown-linux-gnu

default:
  image: rust:latest
  tags:
    - shared
  before_script:
    - rustup target add $TARGET
    - rustup component add rustfmt clippy

# ----------------------------------------------------------------------------
# build  (highest shared-runner priority; pico first)
# ----------------------------------------------------------------------------

# Hidden template: build a workspace crate for an explicit target, then copy the
# binary to the project root so the artifact downloads as just the binary.
# Per-target jobs set BIN and TARGET. The crate dir is derived as
# $WORKSPACE_DIR/$BIN, which holds because each crate's directory name equals its
# package/binary name (a crate breaking that convention would need an explicit dir).
# Building from the crate dir means the firmware crate's crate-local .cargo/config.toml
# (linker script) is picked up; the host crate has no such config and builds natively.
# Output lands in $CARGO_TARGET_DIR/$TARGET/release/$BIN on the persistent volume.
.cargo-build:
  stage: build
  needs: []
  script:
    - (cd "$WORKSPACE_DIR/$BIN" && cargo build --release --target "$TARGET")
    - install -Dm755 "$CARGO_TARGET_DIR/$TARGET/release/$BIN" "$BIN"
  artifacts:
    name: "$BIN-$CI_COMMIT_SHORT_SHA"
    paths:
      - $BIN
      # Ship the probe selector to the HIL run jobs. They use GIT_STRATEGY: none and
      # so have no checkout of their own; they receive the script via `needs:
      # artifacts`. Harmless in the host artifact, which never runs it.
      - $WORKSPACE_DIR/ci/select-probe.sh
    expire_in: 1 year

build-rp2040:
  extends: .cargo-build
  variables:
    BIN: mrs-benchmark-rp2040
    TARGET: thumbv6m-none-eabi

build-rp2350:
  extends: .cargo-build
  variables:
    BIN: mrs-benchmark-rp2350
    TARGET: thumbv8m.main-none-eabihf

build-host:
  extends: .cargo-build
  variables:
    BIN: mrs-benchmark-host
    TARGET: x86_64-unknown-linux-gnu

build-stm32:
  extends: .cargo-build
  variables:
    BIN: mrs-benchmark-stm32
    TARGET: thumbv7em-none-eabihf

# ----------------------------------------------------------------------------
# run
# ----------------------------------------------------------------------------

# Hidden template: flash a firmware ELF on real hardware and capture RTT output.
# Runs on the HIL host; probe-rs lives in the gitlab-runner user's ~/.cargo/bin.
# Per-target jobs set CHIP and ELF and `needs:` their build job, so they start the
# instant that build finishes — in parallel with the shared runner's other jobs.
.firmware-flash:
  stage: run
  tags:
    - hil
  before_script:
    - source "$HOME/.cargo/env"
  variables:
    GIT_STRATEGY: none
    CAPTURE_SECS: "240"
    LOG: results.log
  script:
    - set -o pipefail
    # Several probes share one VID:PID on the HIL host, so probe-rs would refuse
    # with "multiple probes found". Pick the probe attached to this job's chip.
    - PROBE=$(bash "$WORKSPACE_DIR/ci/select-probe.sh" "$CHIP")
    - timeout ${CAPTURE_SECS}s probe-rs run --chip "$CHIP" --probe "$PROBE" "$ELF" | tee "$LOG"
  artifacts:
    name: "bench-$CI_COMMIT_SHORT_SHA"
    paths:
      - $LOG
    # Keep the log on failure
    when: always
    expire_in: 1 year
  allow_failure: true

run-rp2040:
  extends: .firmware-flash
  needs:
    - build-rp2040
  variables:
    CHIP: RP2040
    ELF: mrs-benchmark-rp2040
    LOG: rp2040.log

run-rp2350:
  extends: .firmware-flash
  needs:
    - build-rp2350
  variables:
    CHIP: RP235x
    ELF: mrs-benchmark-rp2350
    LOG: rp2350.log

run-stm32:
  extends: .firmware-flash
  needs:
    - build-stm32
  variables:
    CHIP: STM32F405RGTx
    ELF: mrs-benchmark-stm32
    LOG: stm32.log
  # TODO change this back when STM connected
  rules:
    - when: manual

# Execute the host binary built above; its stdout is the host benchmark result.
run-host:
  stage: run
  needs:
    - build-host
  before_script: []
  variables:
    GIT_STRATEGY: none
  script:
    - ./mrs-benchmark-host | tee host.log
  artifacts:
    name: "host-bench-$CI_COMMIT_SHORT_SHA"
    paths:
      - host.log
    expire_in: 1 year

# ----------------------------------------------------------------------------
# collect
# ----------------------------------------------------------------------------

# Download every available per-target log and merge the BENCH rows into one
# results.csv. run-host always produces rows, so the merge is never empty on a
# normal pipeline; the firmware run jobs are optional (manual / may fail).
collect-results:
  stage: collect
  needs:
    - job: run-host
      artifacts: true
    - job: run-rp2040
      artifacts: true
      optional: true
    - job: run-rp2350
      artifacts: true
      optional: true
    # TODO readd as soon as STM is connected
    # - job: run-stm32
    #   artifacts: true
    #   optional: true
  script:
    - cd "$WORKSPACE_DIR" && cargo run --quiet -p mrs-benchmark-collect -- ../*.log -o ../results.csv
  artifacts:
    name: "results-$CI_COMMIT_SHORT_SHA"
    paths:
      - results.csv
    expire_in: 1 year

# ----------------------------------------------------------------------------
# check
# ----------------------------------------------------------------------------

fmt:
  stage: check
  needs: []
  # Formatting is advisory: report it but don't block anything.
  allow_failure: true
  script:
    - cd $WORKSPACE_DIR && cargo fmt --all -- --check

# Host + core (native target) via the workspace default-members.
clippy-host:
  stage: check
  needs: []
  allow_failure: true
  script:
    - cd $WORKSPACE_DIR && cargo clippy -- -D warnings

# Firmware crate
clippy-stm32:
  stage: check
  needs: []
  allow_failure: true
  variables:
    TARGET: thumbv7em-none-eabihf
  script:
    - cd $WORKSPACE_DIR/mrs-benchmark-stm32 && cargo clippy -- -D warnings

# Firmware crate
clippy-rp2040:
  stage: check
  needs: []
  allow_failure: true
  variables:
    TARGET: thumbv6m-none-eabi
  script:
    - cd $WORKSPACE_DIR/mrs-benchmark-rp2040 && cargo clippy -- -D warnings

# Firmware crate
clippy-rp2350:
  stage: check
  needs: []
  allow_failure: true
  variables:
    TARGET: thumbv8m.main-none-eabihf
  script:
    - cd $WORKSPACE_DIR/mrs-benchmark-rp2350 && cargo clippy -- -D warnings
