# CI for the mrs-microbenchmarks workspace (benchmarks/).
# Job definitions live in .gitlab/ci/*.yml; this file holds shared config only.

stages:
  - build
  - run
  - collect
  - check

variables:
  # Cargo state lives on the persistent /persist volume
  CARGO_HOME: /persist/cargo
  CARGO_TARGET_DIR: /persist/target
  WORKSPACE_DIR: benchmarks
  TARGET: x86_64-unknown-linux-gnu
  SELECT_PROBE_SCRIPT: .gitlab/ci/select-probe.sh

default:
  image: rust:latest
  tags:
    - shared
  before_script:
    - rustup target add $TARGET
    - rustup component add rustfmt clippy

include:
  - local: .gitlab/ci/build.yml
  - local: .gitlab/ci/run.yml
  - local: .gitlab/ci/collect.yml
  - local: .gitlab/ci/check.yml
