# Flashes a firmware ELF on the HIL host and captures RTT output across
# release, lto, and size profiles. Per-target jobs set CHIP/BIN/TARGET_NAME
# and `needs:` their build job.
.firmware-flash:
  stage: run
  tags:
    - hil
  before_script:
    - source "$HOME/.cargo/env"
  variables:
    GIT_STRATEGY: none
    CAPTURE_SECS: "240"
    PROFILES: "release lto size"
  script:
    - set -o pipefail
    # GIT_STRATEGY: none leaves this job's old logs on disk between runs, see docs/hil-setup.md.
    - rm -f -- "${TARGET_NAME}"*.log
    # PROBE comes from a HIL_PROBE_* project variable; several probes are attached, so
    # probe-rs needs one named. PROBE_SPEED = SWD clock in kHz; gates flashing and RTT
    # reads alike. Both in docs/hil-setup.md.
    - |
      for PROF in $PROFILES; do
        ELF="${BIN}-${PROF}"
        LOG="${TARGET_NAME}-${PROF}.log"
        echo "=== Flashing ${ELF} on ${CHIP} ==="
        # probe-rs intermittently fails the first flash after a fresh probe attach
        # (AP/DRW communication error during erase); retry before giving up, see
        # docs/hil-setup.md "Probe selection".
        for attempt in 1 2 3; do
          timeout ${CAPTURE_SECS}s probe-rs run --chip "$CHIP" ${PROBE:+--probe "$PROBE"} ${PROBE_SPEED:+--speed "$PROBE_SPEED"} "$ELF" | tee "$LOG" && break
          [ "$attempt" -eq 3 ] && exit 1
          echo "flash attempt ${attempt} failed, retrying..." >&2
        done
      done
  artifacts:
    name: "bench-$CI_COMMIT_SHORT_SHA"
    paths:
      # Scoped to this target, not a bare "*.log": see docs/hil-setup.md.
      - "${TARGET_NAME}-*.log"
    when: always
    expire_in: 1 year
  allow_failure: true

run-rp2040:
  extends: .firmware-flash
  needs:
    - build-rp2040
  variables:
    CHIP: RP2040
    BIN: mrs-benchmark-rp2040
    TARGET_NAME: rp2040
    PROBE: $HIL_PROBE_RP2040
    PROBE_SPEED: "10000"

run-stm32:
  extends: .firmware-flash
  needs:
    - build-stm32
  variables:
    CHIP: STM32F405RGTx
    BIN: mrs-benchmark-stm32
    TARGET_NAME: stm32
    PROFILES: "release lto size xlto"
    PROBE: $HIL_PROBE_STM32
    PROBE_SPEED: "4000" # fastest step this J-Link accepts

run-nrf52840:
  extends: .firmware-flash
  needs:
    - build-nrf52840
  variables:
    CHIP: nRF52840_xxAA
    BIN: mrs-benchmark-nrf52840
    TARGET_NAME: nrf52840
    PROFILES: "release lto size xlto"
    PROBE: $HIL_PROBE_NRF52840
    PROBE_SPEED: "4000" # this J-Link caps here; 4500+ are rejected outright

run-rp2350:
  extends: .firmware-flash
  needs:
    - build-rp2350
  variables:
    CHIP: RP235x
    BIN: mrs-benchmark-rp2350
    TARGET_NAME: rp2350
    PROFILES: "release lto size xlto"
    PROBE: $HIL_PROBE_RP2350
    PROBE_SPEED: "10000"

run-esp32s3:
  extends: .firmware-flash
  needs:
    - build-esp32s3
  variables:
    CHIP: esp32s3
    BIN: mrs-benchmark-esp32s3
    TARGET_NAME: esp32s3
    PROBE: $HIL_PROBE_ESP32S3

run-host:
  stage: run
  needs:
    - build-host
  variables:
    GIT_STRATEGY: none
  script:
    - ./mrs-benchmark-host-release | tee host-release.log
    - ./mrs-benchmark-host-lto | tee host-lto.log
    - ./mrs-benchmark-host-size | tee host-size.log
  artifacts:
    name: "host-bench-$CI_COMMIT_SHORT_SHA"
    paths:
      - host-*.log
    expire_in: 1 year
