# Builds crate $BIN for $TARGET with $PROFILE from its own crate dir
# (picks up crate-local .cargo/config.toml) and flattens the binary to the project root.
.cargo-build:
  stage: build
  needs: []
  parallel:
    matrix:
      - PROFILE: [release, lto, size]
  script:
    - CARGO_FLAG=$([ "$PROFILE" = "release" ] && echo "--release" || echo "--profile $PROFILE")
    # RUSTFLAGS replaces the crate's .cargo/config.toml rustflags, so XLTO_RUSTFLAGS repeats them.
    - if [ "$PROFILE" = "xlto" ]; then export RUSTFLAGS="$XLTO_RUSTFLAGS"; fi
    - (cd "$WORKSPACE_DIR/$BIN" && cargo build $CARGO_FLAG --target "$TARGET")
    - install -Dm755 "$CARGO_TARGET_DIR/$TARGET/$PROFILE/$BIN" "$BIN-$PROFILE"
  artifacts:
    name: "$BIN-$PROFILE-$CI_COMMIT_SHORT_SHA"
    paths:
      - "$BIN-$PROFILE"
    expire_in: 1 year

build-rp2040:
  extends: .cargo-build
  variables:
    BIN: mrs-benchmark-rp2040
    TARGET: thumbv6m-none-eabi

build-stm32:
  extends: .cargo-build
  parallel:
    matrix:
      - PROFILE: [release, lto, size, xlto]
  variables:
    BIN: mrs-benchmark-stm32
    TARGET: thumbv7em-none-eabihf
    XLTO_RUSTFLAGS: "-C linker-plugin-lto -C target-cpu=cortex-m4 -C link-arg=-Tlink.x -C link-arg=--lto-O3 -C link-arg=--mllvm=-import-instr-limit=500"

build-rp2350:
  extends: .cargo-build
  parallel:
    matrix:
      - PROFILE: [release, lto, size, xlto]
  variables:
    BIN: mrs-benchmark-rp2350
    TARGET: thumbv8m.main-none-eabihf
    XLTO_RUSTFLAGS: "-C linker-plugin-lto -C target-cpu=cortex-m33 -C link-arg=--nmagic -C link-arg=-Tlink.x -C link-arg=--lto-O3 -C link-arg=--mllvm=-import-instr-limit=500"

build-host:
  extends: .cargo-build
  variables:
    BIN: mrs-benchmark-host
    TARGET: x86_64-unknown-linux-gnu

build-esp32s3:
  extends: .cargo-build
  before_script:
    - source "$HOME/export-esp.sh"
  variables:
    BIN: mrs-benchmark-esp32s3
    TARGET: xtensa-esp32s3-none-elf
