# Builds crate $BIN for $TARGET with $PROFILE via the matching `cargo make build-<chip>[-$PROFILE]`
# task (Makefile.toml owns the actual cargo/rustflags invocation, including xlto's cross-language
# LTO flags), then flattens the binary to the project root. <chip> is $BIN with its
# "mrs-benchmark-" prefix stripped, e.g. mrs-benchmark-stm32 -> build-stm32.
.cargo-build:
  stage: build
  needs: []
  parallel:
    matrix:
      - PROFILE: [release, lto, size]
  script:
    - TASK="build-${BIN#mrs-benchmark-}"
    - if [ "$PROFILE" != "release" ]; then TASK="$TASK-$PROFILE"; fi
    - cargo make "$TASK"
    - install -Dm755 "$CARGO_TARGET_DIR/$TARGET/$PROFILE/$BIN" "$BIN-$PROFILE"
  artifacts:
    name: "$BIN-$PROFILE-$CI_COMMIT_SHORT_SHA"
    paths:
      - "$BIN-$PROFILE"
    expire_in: 1 year

build-rp2040:
  extends: .cargo-build
  variables:
    BIN: mrs-benchmark-rp2040
    TARGET: thumbv6m-none-eabi

build-stm32:
  extends: .cargo-build
  parallel:
    matrix:
      - PROFILE: [release, lto, size, xlto]
  variables:
    BIN: mrs-benchmark-stm32
    TARGET: thumbv7em-none-eabihf

build-nrf52840:
  extends: .cargo-build
  parallel:
    matrix:
      - PROFILE: [release, lto, size, xlto]
  variables:
    BIN: mrs-benchmark-nrf52840
    TARGET: thumbv7em-none-eabihf

build-rp2350:
  extends: .cargo-build
  parallel:
    matrix:
      - PROFILE: [release, lto, size, xlto]
  variables:
    BIN: mrs-benchmark-rp2350
    TARGET: thumbv8m.main-none-eabihf

build-host:
  extends: .cargo-build
  variables:
    BIN: mrs-benchmark-host
    TARGET: x86_64-unknown-linux-gnu

build-esp32s3:
  extends: .cargo-build
  variables:
    BIN: mrs-benchmark-esp32s3
    TARGET: xtensa-esp32s3-none-elf
