# ----------------------------------------------------------------------------
# report
# ----------------------------------------------------------------------------

# Renders results.csv into a per-platform PDF via viz/plot.py (see
# docs/benchmark-viz.md). Separate stage/job from collect so a plotting bug
# can't fail the CSV artifact and can be retried alone.
report-pdf:
  stage: report
  needs:
    - job: collect-results
      artifacts: true
  allow_failure: true
  script:
    - uv run tools/inputs_generator/evaluate_accuracy.py --results results.csv --reference benchmarks/reference_results.json --output-csv accuracy_results.csv --output-json accuracy_results.json
    - uv run --project viz viz/plot.py results.csv report.pdf
  artifacts:
    name: "report-$CI_COMMIT_SHORT_SHA"
    paths:
      - report.pdf
      - accuracy_results.csv
      - accuracy_results.json
    expire_in: 1 year
