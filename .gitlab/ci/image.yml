# Rebuilds and republishes the shared CI image only when its Dockerfile changes.
# Uses kaniko (not docker:dind) because it builds from an unprivileged container —
# the shared runner isn't configured with `privileged = true` and changing that needs
# a lab admin.
# The Dockerfile lives under .github/ (shared with the GitHub Actions pipeline, see
# docs/draft/github-migration.md); this job keeps building it for GitLab until cut-over.
build-ci-image:
  stage: image
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  rules:
    - changes:
        - .github/docker/Dockerfile.ci
        - .gitlab/ci/image.yml
  script:
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/.github/docker"
      --dockerfile "${CI_PROJECT_DIR}/.github/docker/Dockerfile.ci"
      --destination "${CI_REGISTRY_IMAGE}/ci:${CI_COMMIT_SHORT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/ci:latest"
